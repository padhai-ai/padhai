<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhAI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .feature {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      cursor: pointer;
    }

    .feature p {
      color: #666;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .chat-box {
      min-height: 300px;
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .user-message,
    .ai-message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .user-message {
      background: #e0e7ff;
      text-align: right;
    }

    .ai-message {
      background: #eeeeee;
    }
