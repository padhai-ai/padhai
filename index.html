<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhAI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .feature {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      cursor: pointer;
    }

    .feature:active {
      transform: scale(.98);
    }

    .feature p {
      color: #666;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
      text-align: center;
    }

    .profile-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 PadhAI</h1>
  <p>Learn smarter. Learn faster.</p>
</header>

<div class="container">

  <!-- AUTHENTICATION -->
  <div id="authSection">

    <div class="card">

      <h2 id="authTitle">📝 Create Account</h2>

      <input
        id="name"
        type="text"
        placeholder="Your name"
      >

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button
        id="authButton"
        type="button"
        onclick="signup()"
      >
        Create Account
      </button>

      <button
        class="secondary"
        type="button"
        onclick="toggleAuth()"
        id="toggleButton"
      >
        Already have an account? Login
      </button>

      <div id="authMessage" class="message"></div>

    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboardSection" class="hidden">

    <div class="card">

      <h2 id="welcomeTitle">
        Welcome to PadhAI 👋
      </h2>

      <p>
        What would you like to learn today?
      </p>

    </div>


    <div class="grid">

      <!-- AI TUTOR -->
      <div class="feature" onclick="openTutor()">
        <h
