<script>

"use strict";

let currentUser = null;
let quizQuestions = [];
let currentQuestionIndex = 0;
let quizScore = 0;
let selectedAnswer = null;
let studyLevel = "beginner";

function $(id){
  return document.getElementById(id);
}

/* PAGE CONTROL */

function hideAll(){
  ["auth","dashboard","profile","tutor","study","quiz"].forEach(function(id){
    const el = $(id);
    if(el) el.classList.add("hidden");
  });
}

function showAuth(){
  hideAll();
  $("auth").classList.remove("hidden");
}

function showDashboard(){
  if(!currentUser){
    showAuth();
    return;
  }

  hideAll();
  $("dashboard").classList.remove("hidden");
  $("welcomeName").textContent = currentUser.name || "Student";
}

function showProfile(){
  if(!currentUser){
    showAuth();
    return;
  }

  hideAll();
  $("profile").classList.remove("hidden");

  $("profileName").textContent = currentUser.name || "";
  $("profileEmail").textContent = currentUser.email || "";
}

function openTutor(){
  if(!currentUser){
    showAuth();
    return;
  }

  hideAll();
  $("tutor").classList.remove("hidden");
}

function openStudy(){
  if(!currentUser){
    showAuth();
    return;
  }

  hideAll();
  $("study").classList.remove("hidden");
}

function openQuiz(){
  if(!currentUser){
    showAuth();
    return;
  }

  hideAll();
  $("quiz").classList.remove("hidden");
}


/* SIGNUP */

async function createAccount(){

  const name = $("name").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const message = $("message");
  const button = $("authButton");

  if(!name){
    message.textContent = "Please enter your name.";
    return;
  }

  if(!email){
    message.textContent = "Please enter your email.";
    return;
  }

  if(!password){
    message.textContent = "Please enter a password.";
    return;
  }

  if(password.length < 6){
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  message.textContent = "Creating account...";
  button.disabled = true;

  try{

    const response = await fetch("/api/signup", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        name:name,
        email:email,
        password:password
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Server returned invalid response: " + text);
    }

    if(!response.ok || !data.success){

      message.textContent =
        data.error || "Account creation failed.";

      button.disabled = false;
      return;
    }

    currentUser = {
      id:data.id || null,
      name:data.name || name,
      email:data.email || email
    };

    localStorage.setItem(
      "padhaiUser",
      JSON.stringify(currentUser)
    );

    $("password").value = "";
    message.textContent = "";

    showDashboard();

  }catch(error){

    console.error("SIGNUP ERROR:", error);

    message.textContent =
      "Server error. Check your Worker API.";

  }

  button.disabled = false;
}


/* LOGIN */

function showLogin(){

  $("authTitle").textContent = "🔐 Login to PadhAI";

  $("name").classList.add("hidden");

  $("authButton").textContent = "Login";

  $("switchButton").textContent =
    "Don't have an account? Create Account";

  $("message").textContent = "";

  $("authButton").onclick = login;
  $("switchButton").onclick = showSignup;
}

function showSignup(){

  $("authTitle").textContent = "📝 Create Account";

  $("name").classList.remove("hidden");

  $("authButton").textContent = "Create Account";

  $("switchButton").textContent =
    "Already have an account? Login";

  $("message").textContent = "";

  $("authButton").onclick = createAccount;
  $("switchButton").onclick = showLogin;
}

async function login(){

  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const message = $("message");
  const button = $("authButton");

  if(!email){
    message.textContent = "Enter your email.";
    return;
  }

  if(!password){
    message.textContent = "Enter your password.";
    return;
  }

  message.textContent = "Logging in...";
  button.disabled = true;

  try{

    const response = await fetch("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:email,
        password:password
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Invalid server response");
    }

    if(!response.ok || !data.success){

      message.textContent =
        data.error || "Invalid email or password.";

      button.disabled = false;
      return;
    }

    currentUser = {
      id:data.id || null,
      name:data.name || "Student",
      email:data.email || email
    };

    localStorage.setItem(
      "padhaiUser",
      JSON.stringify(currentUser)
    );

    $("password").value = "";
    message.textContent = "";

    showDashboard();

  }catch(error){

    console.error("LOGIN ERROR:",error);

    message.textContent =
      "Server error. Check your Worker API.";

  }

  button.disabled = false;
}


/* LOGOUT */

function logout(){

  currentUser = null;

  localStorage.removeItem("padhaiUser");

  $("name").value = "";
  $("email").value = "";
  $("password").value = "";

  showSignup();
  showAuth();
}


/* TUTOR */

async function askTutor(){

  const question = $("question").value.trim();
  const chat = $("chat");
  const message = $("tutorMessage");
  const button = $("askButton");

  if(!question){
    message.textContent = "Please enter a question.";
    return;
  }

  const userBubble = document.createElement("div");

  userBubble.className = "bubble user-bubble";
  userBubble.textContent = question;

  chat.appendChild(userBubble);

  $("question").value = "";

  message.textContent = "PadhAI is thinking...";
  button.disabled = true;

  try{

    const response = await fetch("/api/tutor",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:question
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Invalid tutor response");
    }

    const aiBubble = document.createElement("div");

    aiBubble.className = "bubble ai-bubble";

    if(!response.ok || !data.success){

      aiBubble.textContent =
        data.error || "Sorry, I couldn't answer that.";

    }else{

      aiBubble.textContent =
        data.answer || data.response || "No answer received.";

    }

    chat.appendChild(aiBubble);

    chat.scrollTop = chat.scrollHeight;

    message.textContent = "";

  }catch(error){

    console.error(error);

    message.textContent =
      "Tutor connection error.";

  }

  button.disabled = false;
}

function clearChat(){

  $("chat").innerHTML = `
    <div class="bubble ai-bubble">
👋 Hi! I'm PadhAI Tutor.

Ask me anything about your studies and I'll help you understand it step by step.
    </div>
  `;

  $("tutorMessage").textContent = "";
}


/* STUDY */

function selectStudyLevel(level){

  studyLevel = level;

  $("beginnerButton").classList.remove("active");
  $("intermediateButton").classList.remove("active");
  $("advancedButton").classList.remove("active");

  if(level === "beginner"){
    $("beginnerButton").classList.add("active");
  }

  if(level === "intermediate"){
    $("intermediateButton").classList.add("active");
  }

  if(level === "advanced"){
    $("advancedButton").classList.add("active");
  }
}

async function generateStudyLesson(){

  const topic = $("studyTopic").value.trim();
  const message = $("studyMessage");
  const button = $("studyButton");

  if(!topic){
    message.textContent = "Enter a topic first.";
    return;
  }

  message.textContent = "Creating your lesson...";
  button.disabled = true;

  try{

    const response = await fetch("/api/study",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        topic:topic,
        level:studyLevel
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Invalid study response");
    }

    if(!response.ok || !data.success){

      message.textContent =
        data.error || "Could not create lesson.";

      button.disabled = false;
      return;
    }

    $("lesson").classList.remove("hidden");

    $("lessonTitle").textContent =
      data.title || topic;

    $("lessonIntroduction").textContent =
      data.introduction || "";

    $("lessonExplanation").textContent =
      data.explanation || "";

    $("lessonExample").textContent =
      data.example || "";

    $("lessonSummary").textContent =
      data.summary || "";

    $("keyPoints").innerHTML = "";

    (data.keyPoints || []).forEach(function(point){

      const li = document.createElement("li");

      li.textContent = point;

      $("keyPoints").appendChild(li);

    });

    message.textContent = "";

  }catch(error){

    console.error(error);

    message.textContent =
      "Study connection error.";

  }

  button.disabled = false;
}

function scrollToStudyTop(){

  $("lesson").classList.add("hidden");

  $("studyTopic").value = "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* QUIZ */

function resetQuizScreen(){

  $("quizStart").classList.remove("hidden");
  $("quizGame").classList.add("hidden");
  $("quizResult").classList.add("hidden");

  $("quizMessage").textContent = "";
}

async function generateQuiz(){

  const topic = $("quizTopic").value.trim();
  const message = $("quizMessage");
  const button = $("generateQuizButton");

  if(!topic){
    message.textContent = "Enter a topic first.";
    return;
  }

  message.textContent = "Generating quiz...";
  button.disabled = true;

  try{

    const response = await fetch("/api/quiz",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        topic:topic
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Invalid quiz response");
    }

    if(!response.ok || !data.success){

      message.textContent =
        data.error || "Could not generate quiz.";

      button.disabled = false;
      return;
    }

    quizQuestions = data.questions || [];

    if(!quizQuestions.length){

      message.textContent =
        "No quiz questions received.";

      button.disabled = false;
      return;
    }

    quizTopicValue = topic;
    currentQuestionIndex = 0;
    quizScore = 0;
    selectedAnswer = null;

    $("quizStart").classList.add("hidden");
    $("quizGame").classList.remove("hidden");

    showQuestion();

  }catch(error){

    console.error(error);

    message.textContent =
      "Quiz connection error.";

  }

  button.disabled = false;
}

function showQuestion(){

  const q = quizQuestions[currentQuestionIndex];

  $("questionNumber").textContent =
    currentQuestionIndex + 1;

  $("totalQuestions").textContent =
    quizQuestions.length;

  $("quizQuestion").textContent =
    q.question || "";

  $("quizOptions").innerHTML = "";

  selectedAnswer = null;

  $("nextQuestionButton").disabled = true;

  const options = q.options || [];

  options.forEach(function(option,index){

    const button = document.createElement("button");

    button.className = "option";
    button.type = "button";
    button.textContent = option;

    button.onclick = function(){

      document
        .querySelectorAll(".option")
        .forEach(function(btn){
          btn.classList.remove("selected");
        });

      button.classList.add("selected");

      selectedAnswer = index;

      $("nextQuestionButton").disabled = false;

    };

    $("quizOptions").appendChild(button);

  });
}

function nextQuestion(){

  if(selectedAnswer === null) return;

  const q = quizQuestions[currentQuestionIndex];

  if(Number(selectedAnswer) === Number(q.answer)){
    quizScore++;
  }

  currentQuestionIndex++;

  if(currentQuestionIndex >= quizQuestions.length){

    showQuizResult();

  }else{

    showQuestion();

  }
}

function showQuizResult(){

  $("quizGame").classList.add("hidden");
  $("quizResult").classList.remove("hidden");

  $("scoreNumber").textContent =
    quizScore + "/" + quizQuestions.length;

  if(quizScore === quizQuestions.length){

    $("resultMessage").textContent =
      "Perfect score! 🎉";

  }else if(quizScore >= quizQuestions.length / 2){

    $("resultMessage").textContent =
      "Good job! Keep learning! 💪";

  }else{

    $("resultMessage").textContent =
      "Keep practicing! 📚";

  }

  $("quizReview").innerHTML =
    "<strong>Topic:</strong> " +
    quizTopicValue;

}

function restartQuiz(){

  $("quizResult").classList.add("hidden");
  $("quizStart").classList.remove("hidden");

  $("quizTopic").value = "";
  $("quizMessage").textContent = "";
}


/* BUTTON CONNECTIONS */

document.addEventListener("DOMContentLoaded",function(){

  $("authButton").onclick = createAccount;
  $("switchButton").onclick = showLogin;

  $("homeButton").onclick = showDashboard;
  $("profileButton").onclick = showProfile;
  $("logoutButton").onclick = logout;

  $("tutorFeature").onclick = openTutor;
  $("studyFeature").onclick = openStudy;
  $("quizFeature").onclick = openQuiz;

  $("profileBackButton").onclick = showDashboard;
  $("tutorBackButton").onclick = showDashboard;
  $("studyBackButton").onclick = showDashboard;
  $("quizBackButton").onclick = showDashboard;

  $("askButton").onclick = askTutor;
  $("clearChatButton").onclick = clearChat;

  $("beginnerButton").onclick = function(){
    selectStudyLevel("beginner");
  };

  $("intermediateButton").onclick = function(){
    selectStudyLevel("intermediate");
  };

  $("advancedButton").onclick = function(){
    selectStudyLevel("advanced");
  };

  $("studyButton").onclick = generateStudyLesson;
  $("anotherStudyButton").onclick = scrollToStudyTop;

  $("generateQuizButton").onclick = generateQuiz;
  $("nextQuestionButton").onclick = nextQuestion;
  $("restartQuizButton").onclick = restartQuiz;


  /* LOAD SAVED USER */

  try{

    currentUser = JSON.parse(
      localStorage.getItem("padhaiUser") || "null"
    );

  }catch(error){

    currentUser = null;

  }

  if(currentUser){

    showDashboard();

  }else{

    showSignup();
    showAuth();

  }

});

</script>

</body>
</html>
