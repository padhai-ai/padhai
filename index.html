<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhAI</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 22px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .feature {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 PadhAI</h1>
  <p>Learn smarter. Learn faster.</p>
</header>

<div class="container">

  <!-- LOGIN / SIGNUP -->
  <div id="auth">

    <div class="card">

      <h2 id="title">📝 Create Account</h2>

      <input
        id="name"
        type="text"
        placeholder="Your name"
      >

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="mainButton">
        Create Account
      </button>

      <button id="switchButton" class="secondary">
        Already have an account? Login
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h2 id="welcome"></h2>
      <p>What would you like to learn today?</p>
    </div>

    <div class="grid">

      <div class="feature" id="tutor">
        <h2>🤖 AI Tutor</h2>
        <p>Ask questions and learn.</p>
      </div>

      <div class="feature" id="subjects">
        <h2>📚 Subjects</h2>
        <p>Explore your subjects.</p>
      </div>

      <div class="feature" id="quiz">
        <h2>📝 Quizzes</h2>
        <p>Test your knowledge.</p>
