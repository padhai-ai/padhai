<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhAI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 PadhAI</h1>
  <p>Your AI-powered learning platform</p>
</header>

<div class="container">

  <div class="card" id="auth">
    <h2>Create Account</h2>

    <input id="name" type="text" placeholder="Your name">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="signupButton" type="button">Create Account</button>

    <div id="message"></div>
  </div>

  <div class="card hidden" id="dashboard">
    <h2>Welcome to PadhAI 🎓</h2>
    <p id="welcome"></p>
  </div>

</div>

<script>
document.getElementById("signupButton").addEventListener("click", async function () {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("message");

  if (!name || !email || !password) {
    message.textContent = "Please fill all fields.";
    return;
  }

  message.textContent = "Creating account...";

  try {

    const response = await fetch("/api/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: name,
        email: email,
        password: password
      })
    });

    const data = await response.json();

    if (data.success) {

      document.getElementById("auth").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      document.getElementById("welcome").textContent =
        "Hello " + name + "! Your account has been created. 🚀";

    } else {

      message.textContent =
        data.error || "Could not create account.";

    }

  } catch (error) {

    console.error(error);
    message.textContent = "Server connection error.";

  }

});
</script>

</body>
</html>
