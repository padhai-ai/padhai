<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PadhAI</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      text-align: center;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-bottom: 0;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .feature {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .feature:hover {
      transform: translateY(-2px);
    }

    .feature p {
      color: #666;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* CHAT */

    .chat-box {
      min-height: 280px;
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
      margin-bottom: 12px;
    }

    .user-message {
      background: #e0e7ff;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      text-align: right;
    }

    .ai-message {
      background: #eeeeee;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
    }

    /* PROFILE */

    .profile-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .profile-row p {
      margin-bottom: 0;
      color: #555;
    }
